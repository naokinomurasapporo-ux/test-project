<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&family=Raleway:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0d1b3e;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(30, 60, 120, 0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(10, 40, 100, 0.5) 0%, transparent 50%);
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 50px 64px;
      text-align: center;
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      color: white;
      max-width: 380px;
      width: 90%;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4e8ef0, #1a56c4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      margin: 0 auto 24px;
      box-shadow: 0 4px 20px rgba(78, 142, 240, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-family: 'Raleway', sans-serif;
      margin: 0 0 6px;
      font-size: 1.9rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.03em;
    }

    .occupation {
      margin: 0 0 28px;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #4e8ef0, #7ab3f5);
      margin: 0 auto 28px;
      border-radius: 2px;
    }

    .info-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .info-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .info-icon {
      font-size: 1rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar">👤</div>
    <h1>Naoki Nomura</h1>
    <p class="occupation">Sales Manager</p>
    <div class="divider"></div>
    <ul class="info-list">
      <li class="info-item">
        <span class="info-icon">🏢</span>
        <span>株式会社サンプル</span>
      </li>
      <li class="info-item">
        <span class="info-icon">📞</span>
        <span>03-1234-5678</span>
      </li>
    </ul>
  </div>
</body>
</html>
