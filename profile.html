<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }

    .profile-card {
      background: white;
      border-radius: 12px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background-color: #4f87c5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      color: #1a202c;
    }

    p.occupation {
      margin: 0;
      font-size: 1rem;
      color: #718096;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar">👤</div>
    <h1>山田 太郎</h1>
    <p class="occupation">ソフトウェアエンジニア</p>
  </div>
</body>
</html>
